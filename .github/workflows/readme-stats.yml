name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Stats Cards
        uses: anuraghazra/github-readme-stats-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          path: stats.svg
          options: 'show_icons=true&theme=dark'

      - name: Generate Languages Cards
        uses: anuraghazra/github-readme-stats-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          path: langs.svg
          options: 'langs_count=10&layout=compact&theme=dark'

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          git commit -m "Update stats cards" || echo "No changes to commit"
          git push
